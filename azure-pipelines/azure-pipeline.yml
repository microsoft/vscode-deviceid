name: $(Date:yyyyMMdd)$(Rev:.r)

trigger: # cause a pipeline to run whenever you push an update to the specified branches
  batch: true
  branches:
    include:
      - main

parameters:
- name: Publish
  displayName: Push to public npm feed?
  type: boolean
  default: false

variables:
  TeamName: 'Visual Studio Technical Insights'

# The `resources` specify the location and version of the 1ES PT.
resources:
  repositories:
  - repository: MicrobuildTemplate
    type: git
    name: 1ESPipelineTemplates/MicroBuildTemplate
    ref: refs/tags/release

extends:
  # The pipeline extends the 1ES PT which will inject different SDL and compliance tasks.
  # For non-production pipelines, use "Unofficial" as defined below.
  # For productions pipelines, use "Official".
  template: azure-pipelines/MicroBuild.1ES.Official.yml@MicroBuildTemplate
  parameters:
    settings:
      networkIsolationPolicy: Permissive,CFSClean,CFSClean2
    customBuildTags:
    - Ignore-Tag
    pool:
      name: VSEng-MicroBuildVSStable
      os: windows  # OS of the image. Allowed values: windows, linux, macOS
    
    stages:
    - stage: BuildNpmPackage
      jobs:
      - job: Build
        templateContext:
          mb:
            signing:
              enabled: true
              signType: Test
              zipSources: false
        displayName: Build npm package
        variables:
          # Route pip through the internal CFS feed; must be set before UsePythonVersion@0 runs its own pip upgrade.
          # Scoped to this job (not pipeline-wide) so it doesn't leak into the 1ES PT's auto-injected
          # "SDL Sources Analysis" job, which has no PipAuthenticate step and would hang trying to reach
          # this private feed until the worker timeout kills it.
          PIP_CONFIG_FILE: '$(Build.SourcesDirectory)/pip.ini'

        steps:
        - task: NodeTool@0
          inputs:
            versionSource: "spec"
            versionSpec: "24.x"
          displayName: 'Install Node.js'

        - task: PipAuthenticate@1
          inputs:
            artifactFeeds: 'DevDiv/DevDeviceId'
          displayName: 'Authenticate pip feed'

        # lock to older version of python. We need diskutils which was removed in Python 3.12
        - task: UsePythonVersion@0
          inputs:
            versionSpec: '3.11'

        - task: npmAuthenticate@0
          inputs:
            workingFile: .npmrc
          displayName: 'Authenticate npm feed'

        - script: |
            npm ci --ignore-scripts
          displayName: 'Install dependencies'

        - script: |
            npm run build
          displayName: 'Compile npm package'

        - ${{ each arch in split('x64,arm64', ',') }}:
          - script: |
              npm run prebuild:windows -- --arch=${{ arch }}
            displayName: 'Build Windows ${{ arch }} prebuild'

          # The next prebuild replaces build\Release, so preserve its PDB now.
          - powershell: |
              $ErrorActionPreference = 'Stop'
              $binary = "$(Build.SourcesDirectory)\prebuilds\win32-${{ arch }}\@vscode+deviceid.node"
              $pdb = "$(Build.SourcesDirectory)\build\Release\windows.pdb"
              foreach ($file in @($binary, $pdb)) {
                if (-not (Test-Path -LiteralPath $file -PathType Leaf)) {
                  throw "Required Windows ${{ arch }} symbol input is missing: $file"
                }
              }
              $destination = "$(Build.ArtifactStagingDirectory)\symbols\win32-${{ arch }}"
              New-Item -ItemType Directory -Path $destination -Force | Out-Null
              Copy-Item -LiteralPath $binary, $pdb -Destination $destination
            displayName: 'Preserve Windows ${{ arch }} binary and matching PDB'

        - script: |
            npm test
          displayName: 'Test npm package'

        - script: |
            npm run lint
          displayName: 'Lint npm package'

        - task: PublishSymbols@2
          displayName: 'Index Windows prebuild sources'
          inputs:
            SymbolsFolder: '$(Build.ArtifactStagingDirectory)\symbols'
            SearchPattern: '**/*.pdb'
            IndexSources: true
            PublishSymbols: false

        - powershell: | 
            New-Item -ItemType Directory -Path "$(Build.ArtifactStagingDirectory)\npmpackages" -Force
          displayName: Create npm package directory

        - script: | 
            npm pack --pack-destination "$(Build.ArtifactStagingDirectory)\npmpackages"
          displayName: 'Create npm package' 

        - script: |
            npm run test:package -- "$(Build.ArtifactStagingDirectory)\npmpackages"
          displayName: 'Test packed npm package'

        - powershell: |
            @'
            const assert = require('node:assert/strict');
            const { execFileSync } = require('node:child_process');
            const { createHash } = require('node:crypto');
            const fs = require('node:fs');
            const path = require('node:path');
            const staging = process.argv[2];
            const packageDirectory = path.join(staging, 'npmpackages');
            const packages = fs.readdirSync(packageDirectory).filter(name => name.endsWith('.tgz'));
            assert.equal(packages.length, 1, 'Expected exactly one packed npm package');
            const tarball = path.join(packageDirectory, packages[0]);
            const hash = data => createHash('sha256').update(data).digest('hex');
            for (const arch of ['x64', 'arm64']) {
              const name = '@vscode+deviceid.node';
              const entry = `package/prebuilds/win32-${arch}/${name}`;
              const packed = execFileSync('tar', ['-xOf', tarball, entry], { maxBuffer: 64 * 1024 * 1024 });
              const staged = fs.readFileSync(path.join(staging, 'symbols', `win32-${arch}`, name));
              assert.equal(hash(packed), hash(staged), `Packed Windows ${arch} binary differs from staged symbol binary`);
              console.log(`Verified Windows ${arch} packaged binary matches staged symbol binary`);
            }
            '@ | node - "$(Build.ArtifactStagingDirectory)"
          displayName: 'Verify packaged binaries match staged symbol binaries'

        - powershell: | 
            Get-ChildItem -Path "$(Build.ArtifactStagingDirectory)\npmpackages"
          displayName: Get contents of $(Build.ArtifactStagingDirectory)\npmpackages

        - task: 1ES.PublishPipelineArtifact@1
          inputs:
            targetPath: '$(Build.ArtifactStagingDirectory)'
            artifactName: drop

        - ${{ if parameters.Publish }}:
          - script: |
              echo ##vso[build.addbuildtag]auto-release
            displayName: 'Apply auto-release tag'

        - task: TSAUpload@2
          inputs:
            GdnPublishTsaOnboard: true
            GdnPublishTsaConfigFile: '$(Build.SourcesDirectory)/.config/TSAOptions.json'
          displayName: 'TSA upload to Codebase (vscode-deviceid)'
